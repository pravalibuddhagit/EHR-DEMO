<div class="card">
  <p-table
    class="mt-base"
    #dt2
    [value]="patients"
    dataKey="id"
    [rows]="10"
    [rowsPerPageOptions]="[1, 25, 50]"
    [loading]="false"
    [paginator]="true"
    [globalFilterFields]="['first_name', 'last_name']"
    [tableStyle]="{ 'min-width': '75rem' }"
  >
    <!-- Table Caption -->
    <ng-template #caption>
      <div class="flex items-center">
        <h1 class="text-xl font-semibold text-gray-800">Patient List</h1>
        <div class="flex items-center gap-sm ml-auto">
          <!-- Filter by Address -->
          <p-columnFilter type="text" field="Address" placeholder="Filter by Address"></p-columnFilter>


          <!-- Filter by Status -->
          <p-dropdown
            [options]="statusOptions"
            [(ngModel)]="selectedStatus"
            optionLabel="label"
            optionValue="value"
            placeholder="Filter by Status"
            (onChange)="onStatusFilterChange($event, dt2)"
          ></p-dropdown>

          <!-- Global Search -->
          <p-iconField iconPosition="left">
            <input
              pInputText
              type="text"
              (input)="onGlobalSearch($event, dt2)"
              placeholder="Search by First Name or Last Name"
            />
            <p-inputIcon>
              <i class="pi pi-search"></i>
            </p-inputIcon>
          </p-iconField>
        </div>
      </div>
    </ng-template>

    <!-- Table Header -->
    <ng-template #header>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Mobile Phone</th>
        <th>Address</th>
        <th>Status</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>

    <!-- Table Body -->
    <ng-template #body let-patient>
      <tr>
        <td>{{ patient.first_name }}</td>
        <td>{{ patient.last_name }}</td>
        <td>{{ patient.email }}</td>
        <td>{{ patient.mobile_phone }}</td>
        <td>{{ patient.Address}}</td>
        <td>
          <p-tag
          [value]="patient.status"
          [severity]="getSeverity(patient.status)"
        ></p-tag>
        </td>

        
        
           
            <td class="text-center">
      <!-- Centered Delete Button -->
      <div class="flex justify-center">
        <i class="pi pi-trash text-red-500 cursor-pointer"></i>
      </div>
    </td>
      
      </tr>
    </ng-template>
  </p-table>
</div>
