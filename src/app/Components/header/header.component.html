<header class="bg-blue-900 shadow-md fixed top-0 left-0 w-full z-50 h-14 md:h-16 flex items-center">
  <nav class="container mx-auto flex items-center justify-between px-12 py-2 md:py-3">
    
    <!-- Logo & Branding -->
    <div class="flex items-center pl-4">
      <img src="../../../../images/favicon.png" alt="EHR Logo" class="h-12 w-auto mr-4">
      <a class="text-white text-lg font-bold flex items-center" routerLink="/">
        EDVAK-EHR
      </a>
    </div>

    <!-- Mobile Menu Button -->
    <button class="text-white text-2xl md:hidden focus:outline-none" (click)="toggleMenu()">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Navigation Links (Moved Slightly Left) -->
    <div class="pr-8">
      <ul class="hidden md:flex gap-6 text-white font-semibold text-lg ml-auto">
        <li><a class="nga-nav-link px-3 py-1" routerLink="/">Features</a></li>
        <li><a class="nga-nav-link px-3 py-1" routerLink="/about">About</a></li>
        <li><a class="nga-nav-link px-3 py-1" routerLink="/contact">Contact</a></li>
      </ul>
    </div>
    
  </nav>

  <!-- Mobile Menu -->
  <div class="md:hidden bg-blue-800 px-6 py-2 space-y-2 text-center text-white" *ngIf="isMenuOpen">
    <a class="block py-2 nga-nav-link" routerLink="/">Features</a>
    <a class="block py-2 nga-nav-link" routerLink="/about">About</a>
    <a class="block py-2 nga-nav-link" routerLink="/contact">Contact</a>
  </div>
</header>
