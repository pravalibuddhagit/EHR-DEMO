<form [formGroup]="loginForm" (ngSubmit)="loginUser()">
  <div class="max-w-sm mx-auto p-8 bg-white rounded-lg shadow-xl">
    <div class="space-y-6">
      <p class="text-2xl font-semibold text-center mb-6">Login</p>

      <!-- Email -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-semibold text-gray-700">Email</label>
        <input
          type="text"
          pInputText
          formControlName="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          name="email"
          placeholder="Type your email"
        />
        <small *ngIf="email.invalid && (email.dirty || email.touched)" class="text-sm text-red-500 mt-1">
          <div *ngIf="email.errors?.['required']">Email is required.</div>
          <div *ngIf="email.errors?.['email']">Email should be valid.</div>
        </small>
      </div>

      <!-- Password -->
      <div class="space-y-2">
        <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
        <input
          type="password"
          pInputText
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          name="password"
          placeholder="Type your password"
        />
        <small *ngIf="password.invalid && (password.dirty || password.touched)" class="text-sm text-red-500 mt-1">
          <div *ngIf="password.errors?.['required']">Password is required.</div>
        </small>
      </div>

      <!-- Sign In Button -->
      <div>
        <button
          type="submit"
          class="w-full py-2 px-4 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 disabled:bg-gray-400"
          [disabled]="loginForm.invalid"
        >
          SIGN IN
        </button>
      </div>

      <!-- Register Link -->
      <div class="mt-4 text-center text-sm">
        Not a member? <a routerLink="/register" class="text-blue-500 hover:text-blue-600">Register</a>
      </div>
    </div>
  </div>
</form>
