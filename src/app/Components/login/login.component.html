<div class="min-h-screen bg-gray-100 flex items-center justify-center">
  <div class="bg-white p-8 shadow-lg rounded-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-4">Login</h2>

    <form #loginForm="ngForm">
      <!-- Step 1: Email Entry -->
      <ng-container *ngIf="step === 1">
        <p-message severity="info" text="Please enter your email to continue"></p-message>

        <div class="my-4">
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            pInputText
            class="w-full p-inputtext mt-1"
            placeholder="Enter your email"
            required
          />
          <small *ngIf="error" class="text-red-600">{{ error }}</small>
        </div>

        <div class="flex items-center mb-4">
          <p-checkbox [(ngModel)]="rememberMe" binary="true" name="rememberMe"></p-checkbox>
          <label class="ml-2 text-sm text-gray-700">Remember Me</label>
        </div>

        <button
          pButton
          label="Next"
          class="bg-sky-400 w-full"
          (click)="onSubmitEmail()"
        ></button>

        <div class="flex justify-center mt-2">
          <button class="text-blue-500 text-sm" (click)="navigateToRegister()">
            Don't have an account? Register here
          </button>
        </div>
      </ng-container>

      <!-- Step 2: Password Entry -->
      <ng-container *ngIf="step === 2">
        <div class="flex items-center mb-4 space-x-16 mt-4"  >
          <button pButton icon="pi pi-arrow-left" class="p-button-text" (click)="goBackToEmail()"></button>
          <p class="ml-2 text-xl">Hello, {{ user?.firstName }} {{ user?.lastName }}!</p>
        </div>

        <div class="flex flex-col items-center mb-4">
          <img src="../../../../images/dummy_photo.jpg" alt="Dummy Profile" class="rounded-full w-24 h-24">
         
        </div>

        <div class="my-4">
          <label class="block text-sm font-medium text-gray-700">Password</label>
         <div class="w-full mt-1">
          <p-password [(ngModel)]="password" [toggleMask]="true"    styleClass="w-full"
          inputStyleClass="w-full" name="password"  required   [toggleMask]="true" [feedback]="false"/>
         </div>
          <small *ngIf="error" class="text-red-600">{{ error }}</small>
        </div>

        <button
          pButton
          label="Login"
          class="bg-sky-400 w-full"
          (click)="onSubmitPassword()"
        ></button>
      </ng-container>
    </form>
  </div>
</div>
